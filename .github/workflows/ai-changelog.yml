name: Generate Changelog for PR

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  changelog:
    name: Generate Changelog for PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/changelog'
    steps:
      - name: Generate changelog for PR
        uses: Automattic/vip-actions/ai-changelog-generator@eeb5b001885157fbbe6d06a89214b97fd5b03539
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
